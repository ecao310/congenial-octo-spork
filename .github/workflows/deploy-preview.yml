name: Deploy dev preview to GitHub Pages

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    permissions:
      contents: read
      pages: write
      id-token: write

    # The repo has one GitHub Pages site and it is published by main's
    # workflow. To publish dev without changing main, this job rebuilds main's
    # site exactly as main would, then nests the dev build under /preview/ and
    # publishes the combined tree. The production URL therefore always serves
    # main's code, and if main fails to build nothing is published at all.
    steps:
      - name: Check out main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Check out dev (preview)
        uses: actions/checkout@v4
        with:
          path: dev-src

      - name: Build production site from main
        working-directory: main-src
        run: |
          npm install
          npm run build

      - name: Test and build preview site from dev
        working-directory: dev-src
        run: |
          npm install
          npm run test
          npx tsc -b
          npx vite build --base=/congenial-octo-spork/preview/

      - name: Assemble combined site
        run: |
          mkdir -p site/preview
          cp -R main-src/dist/. site/
          cp -R dev-src/dist/. site/preview/
          echo "--- published tree ---"
          find site -maxdepth 2 -mindepth 1 | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
