<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- The favicon is drawn in the page's own two colours; `apple-touch-icon`
       is the same mark rasterised, because iOS will not take an SVG. Both
       hrefs go through %BASE_URL% rather than a bare `/`, which vite rewrites
       for the production build and the /preview/ one alike. -->
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <meta name="theme-color" content="#f7f3eb" />

  <!-- The two faces the page is set in: Newsreader for everything read and
       IBM Plex Mono for everything counted. Google Fonts is the one host the
       page asks anything of; the stacks in src/styles/index.css fall back to
       Georgia and Menlo until the faces arrive. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&amp;family=IBM+Plex+Mono:wght@300;400;500;600&amp;display=swap" />

  <title>Income Taxes in Retirement — Tax Torpedo</title>
  <!-- The search result, which is a different surface from the share card
       below: a crawler reads this one and a chat window reads those. It ends
       on the list of sections it promises, and `the search snippet` in
       src/guards/meta.test.ts reads that list back out and looks for each one in a
       heading the page actually renders — this tag advertised capital-gains
       stacking for two backlogs after the step came off. -->
  <meta name="description"
    content="What the next dollar of retirement income really costs, for your own return: the tax torpedo, IRMAA cliffs and the senior deduction phaseout.">

  <!-- What the link looks like when it is sent rather than opened.
       ────────────────────────────────────────────────────────────────────
       The close's copy button hands the reader a URL with their whole return
       in the query string, and until this block existed that URL rendered in
       Messages, in Slack or in a forum post as a bare
       `?filing=mfj&income=90000` with nothing saying what it showed.

       The card is deliberately *not* the reader's own scenario. This page is
       static files on GitHub Pages: no server sees the query string, so no
       preview can be rendered from it, and a card that quoted figures would
       be quoting the default's figures at everyone who shared a link. So it
       says what the page is, and the figures stay on the page.

       Absolute URLs, because a crawler will not resolve a relative og:image —
       assembled from the origin plus %BASE_URL% so the preview build under
       /preview/ points at its own copy rather than production's. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tax Torpedo" />
  <meta property="og:title" content="How Much Can You Take Out This Year?" />
  <meta property="og:description"
    content="The next dollar out of an IRA rarely costs what its bracket says. See where Social Security's tax torpedo turns 12% into 22.2% — drawn across every income level for your own return." />
  <meta property="og:url" content="https://ecao310.github.io%BASE_URL%" />
  <meta property="og:image" content="https://ecao310.github.io%BASE_URL%og-cover.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="A chart of the marginal tax rate on the next dollar of retirement income: flat at 0%, stepping up to a 22.2% plateau, dropping back to 12%, then climbing through 22% and 24%." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="How Much Can You Take Out This Year?" />
  <meta name="twitter:description"
    content="The next dollar out of an IRA rarely costs what its bracket says. See where Social Security's tax torpedo turns 12% into 22.2% — drawn across every income level for your own return." />
  <meta name="twitter:image" content="https://ecao310.github.io%BASE_URL%og-cover.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
