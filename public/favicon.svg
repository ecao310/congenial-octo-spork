<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Tax torpedo">
  <!-- The page's own shape at 16px: a rate flat on the valley floor, spiking
       as the benefit follows income into the tax base, falling back once the
       benefit is fully in, then climbing again with the brackets. Paper with
       an ink edge, and the curve in the accent — --surface, --ink and
       --accent from src/styles/index.css; `the cover` in
       src/guards/meta.test.ts fails if the ground or the accent moves without
       this file. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#f7f3eb" stroke="#261d16" stroke-width="1"/>
  <path d="M4 25H9L12 10H16L19 18H23L27 7" fill="none" stroke="#2769b7"
    stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
